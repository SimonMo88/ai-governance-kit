name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check tag and version
        run: test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)"
      - name: Verify
        run: |
          sh -n install.sh bin/ai-governance tests/*.sh
          sh tests/readme-links.sh
          sh tests/install-and-cli.sh
      - name: Build release files
        run: |
          mkdir dist
          cp install.sh dist/install.sh
          git archive --format=tar.gz \
            --prefix=ai-governance-kit/ \
            --output=dist/ai-governance-kit.tar.gz HEAD
          cd dist
          shasum -a 256 ai-governance-kit.tar.gz > ai-governance-kit.tar.gz.sha256
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/install.sh \
            dist/ai-governance-kit.tar.gz \
            dist/ai-governance-kit.tar.gz.sha256 \
            --generate-notes \
            --verify-tag
